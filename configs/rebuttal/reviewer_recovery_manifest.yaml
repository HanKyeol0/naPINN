# All six entries below were unblocked on 2026-07-28. Each now has a frozen
# protocol and a launched campaign; none of their numbers may be used until
# the stated completeness rule is met.
reviewer_requests_with_protocol_frozen_20260728:
  heteroscedastic_noise:
    status: protocol_frozen_running
    protocol: >-
      State-dependent sensor error on real Cylinder PIV with
      sigma_i(t) = base * clean_component_std * (1 + gain * speed_i(t) /
      mean_training_speed), base 1.0 and gain 4.0, failure fraction 0.15.
      Variance therefore varies with position, time and state together.
    frozen_manifest: outputs/rebuttal/structured_piv_extra_20260728/manifest_frozen.json
    derived_npz_sha256: a0503518c527aeae5d6b5bc9ef8469d2ba751f1713444a076aa1783a7fc42f88
  controlled_uv_noise_covariance:
    status: protocol_frozen_running
    protocol: >-
      Bivariate normal innovation with fixed correlation rho = 0.8 between the
      u and v components, scale 3.0 matching the AR(1) condition and no
      temporal correlation, so the contrast with AR(1) isolates cross-component
      correlation. Realized correlation 0.8029.
    frozen_manifest: outputs/rebuttal/structured_piv_extra_20260728/manifest_frozen.json
    derived_npz_sha256: 7ddf47301ca7425943653be72c08b2def05699fe6cfe72ae08d4bf3ea53a0cd7
  hmc_bayesian_pinn:
    status: protocol_frozen_running
    protocol: >-
      Full HMC over network weights and the unknown PDE coefficient with a
      fixed design (collocation and measurement sets drawn once), leapfrog 30,
      2 chains, 1000 burn-in and 1000 retained samples, dual-averaging step
      size confined to burn-in. sigma_pde = 1.0 and both sigma_data in
      {0.1, 1.0} are reported. Sampler settings were fixed on calibration seed
      39 using acceptance rate only, before any error metric was inspected.
    reporting_rule: >-
      Every run emits acceptance rate, split R-hat and effective sample size.
      If the predeclared thresholds (acceptance >= 0.4, R-hat <= 1.1) fail, the
      error values must be reported as an inconclusive reproduction attempt and
      must not be presented as HMC B-PINN performance.
    output_root: outputs/rebuttal/hmc_bpinn_20260728
  gate_initializer_sweep:
    status: protocol_frozen_running
    resolved_discrepancy: >-
      Confirmed by code inspection: the YAML keys init_threshold and
      init_steepness are consumed by LearnableThresholdGate and never reach
      TrainableLikelihoodGate, so the paper's main gated_trainable path always
      used the constructor values cutoff 2.0 and steepness 30.0. New keys
      gate_init_cutoff_sigma and gate_init_steepness were added with exactly
      those defaults, so every completed run reproduces bit-for-bit.
    protocol: >-
      One-factor-at-a-time sweep around the historical operating point on
      Allen-Cahn at 15%, seeds 40-42: cutoff in {1.0, 2.0, 4.0} at default
      steepness and steepness in {10.0, 30.0, 60.0} at default cutoff.
    output_root: outputs/rebuttal/gate_stability_20260728
  hardware_isolated_wall_clock:
    status: protocol_frozen_running
    unblocked_because: >-
      The shared-server constraint no longer applies; four GPUs were idle and
      cuda:0 is now exclusively reserved for this campaign.
    frozen_manifest: outputs/rebuttal/wallclock_isolated_20260728/manifest_frozen.json
    output_root: outputs/rebuttal/wallclock_isolated_20260728
  replacement_outlier_protocol:
    status: protocol_frozen_running
    resolved_discrepancy: >-
      Confirmed by code inspection: the manuscript says gross outliers replace
      an observation, while the code adds a positive offset. An outlier_mode
      option now makes both explicit, defaulting to the additive protocol that
      produced every completed run; the default was verified to reproduce the
      identical corrupted dataset hash.
    protocol: >-
      Allen-Cahn at 15%, six methods, seeds 40-42, with the same corrupted rows
      and the same magnitude draw as the completed additive core, so the two
      protocols are paired and differ only in substitution versus addition.
    output_root: outputs/rebuttal/replacement_outlier_20260728
  staged_training_stability:
    status: protocol_frozen_running
    protocol: >-
      Warm-up removed with the joint stage extended to 30,000 updates, so the
      comparison isolates the schedule rather than the PINN update budget.
      Three PDEs at 15%, seeds 40-42.
    output_root: outputs/rebuttal/gate_stability_20260728
