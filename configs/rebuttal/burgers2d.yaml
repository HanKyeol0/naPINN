tag: rebuttal_canonical
device: "cuda:0"
domain:
  x: [0.0, 4.0]
  y: [0.0, 4.0]
  burn_in_time: 0.1
  record_time: 3.0
pde:
  learn_nu: true
  init_nu: 0.0
