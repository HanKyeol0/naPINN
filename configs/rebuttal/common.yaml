seed: 40
device: "cuda:0"
train:
  epochs: 30000
  batch:
    n_f: 8192
  optimizer:
    name: adam
    lr: 1.0e-3
  loss_weights:
    res: 1.0
    data: 1.0
log:
  out_dir: "analysis/results/runs/rebuttal_synthetic"
  wandb:
    enabled: false
    mode: disabled
eval:
  grid:
    nx: 120
    ny: 120
    nt: 120
  every: 1000
