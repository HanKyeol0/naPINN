schema_version: 1
variant_id: A_upstream_active_0b74f6f
label: Exact active upstream code
evidence_class: upstream_code_reproduction
description: >-
  The official ppilar/PINN-EBM Navier--Stokes execution path at commit
  0b74f6f, including the active hard-coded 4-by-30 Net_NS. No source patch is
  applied. The missing prop_noise input is supplied as zero (additive noise),
  matching the pre-refactor upstream behavior and the paper's additive
  measurement model.

source:
  repository: https://github.com/ppilar/PINN-EBM.git
  commit: 0b74f6f9209d68c79ecb9608b71755977d08f578
  patch: null

dataset:
  filename: cylinder_nektar_wake.mat
  source_url: >-
    https://raw.githubusercontent.com/maziarraissi/PINNs/master/main/Data/cylinder_nektar_wake.mat
  sha256: 99d9e1f9da7d2dff113ff2723373237b455e2de6c6747ac681846fe86fbba3d0
  size_bytes: 24081984

execution:
  seed: 0
  nrun: 5
  seed_semantics: >-
    One seed-0 RNG stream across five sequential upstream runs, preserving
    model order [0,3,2]. These are not independent naPINN reporting seeds
    40--42.
  x_opt: 101
  noise: 3G
  fnoise: 1
  prop_noise: 0
  model_indices: [0, 3, 2]
  pinn_ebm_model_index: 3
  pinn_updates: 100000
  ebm_init_after_pinn_update: 10000
  ebm_init_updates: 2000
  scheduler_update: 80000
  test_interval: 500
  plot_interval: 25000
  joint_pde_weight: 50
  non_ebm_pde_weight: 1
  initial_pde_weight: 1
  ebm_initial_upper_bound: 1

expected_active_source:
  pinn:
    representation: psi_and_pressure
    hidden_layers: 4
    width: 30
    learned_parameters: [lambda1, lambda2]
  ebm:
    hidden_layers: 3
    width: 5
    dropout_before_output: 0.5
    adaptive_integration_points: 1001
    tail_retry: true
  optimizer:
    name: Adam
    pinn_learning_rate: 0.002
    ebm_learning_rate: 0.002
    scheduler_factor: 0.3
  batches:
    data: 200
    collocation: 100
  samples:
    train: 4000
    validation: 1000
    collocation_source: sampled_training_locations

runnability_choice:
  key: prop_noise
  value: 0
  status: required_missing_upstream_input
  rationale: >-
    Commit 0b74f6f reads pars['prop_noise'] but never defines it. Zero retains
    the additive-noise behavior of commit 822777d and Equation (2) of the
    paper. This is a configuration completion, not a source-code change.
