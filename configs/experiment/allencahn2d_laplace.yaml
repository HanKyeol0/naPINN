# Laplace noise experiment for Allen-Cahn 2D
# Identical to allencahn2d.yaml except noise.kind = Laplace
# Purpose: robustness study requested by reviewers

tag: noise_laplace_na_c0
device: "cuda:0"
wandb_project: naPINN_rebuttal
exp_description: "Laplace noise robustness experiment"

domain:
  x: [0.0, 2.0]
  y: [0.0, 2.0]
  t: [0.0, 2.0]
in_features: 3
out_features: 1

pde:
  learn_eps: true
  omega: 8.0
  init_eps: 1.0
  eps: 0.3

sampling_mode: grid
grid:
  nx: 100
  ny: 100
  nt: 100
batch:
  n_f: 5000

noise:
  enabled: true
  batch_size: 1000
  kind: Laplace     # Laplace(mu=0, b=1); scale by sigma_local at runtime
  pars: [0.0, 4.0]  # [mu, b]  — Var = 2b^2, std_eff ≈ 1.41

  sensor_mode: fixed_grid
  n_train: 5000
  n_sensors: 100
  sensor_nx: 15
  sensor_ny: 15

  extra_noise:
    enabled: true
    kind: std
    n_points: 3375 # 1120 / 2250 / 3375
    scale_min: 3.0
    scale_max: 10.0

phase:
  enabled: true # true / false
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: true
  density_estimator: ebm
  std_mode: ema
  momentum: 0.05
  hidden_dim: 32
  depth: 4
  num_grid: 1024
  lr: 1.0e-3
  init_train_epochs: 5000

data_loss:
  kind: mse # mse, L1, q_gaussian
  q: 2.9 # 1.9 / 2.9
  beta: null

data_loss_balancer:
  use_loss_balancer: true # true / false
  kind: gated_trainable
  rejection_cost: 0.5
video:
  enabled: true
  every: 10000
  grid:
    nx: 120
    ny: 120
    nt: 120
  fps: 10
  format: mp4
