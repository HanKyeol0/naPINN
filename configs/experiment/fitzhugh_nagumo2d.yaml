domain:
  x: [0.0, 2.0] # Smaller domain often used for FHN patterns
  y: [0.0, 2.0]
  burn_in_time: 0.0
  record_time: 5.0

pde:
  learn_params: true
  # Initial guesses
  init_alpha: 0.0
  init_beta: 0.0
  
  # Simulation Truth (Pattern Formation regime)
  # Standard FHN: u_t = d_u*Lap(u) + u - u^3 - v + alpha
  #               v_t = d_v*Lap(v) + beta(u - v)
  d_u: 1.0e-3
  d_v: 5.0e-3 # D_v > D_u often needed for interesting Turing patterns
  alpha: 0.1
  beta: 1.0

# simulation
simulation_tag: "FHN_Pattern"
dir_path: "pinnlab/simulation/simulation_result/"

collocation_points:
  nx: 64
  ny: 64
  dt: 0.05

simulation_points:
  nx: 100
  ny: 100
  dt: 0.001
  every: 50 

measurement:
  measure_kind: fixed_random 
  n_sensors: 150 # Sparse random sensors

# experiment
tag: "FHN_Gate"
device: cuda
wandb_project: "naPINN_FHN"

batch:
  n_f: 5000

noise:
  enabled: true
  batch_size: 1000
  kind: "G" 
  relative_scale: 0.10  # 10% Noise
  floor_scale: 0.02

  extra_noise:
    enabled: true
    kind: mean_level
    n_points: 500 
    scale_min: 2.0
    scale_max: 5.0

# phase
phase:
  enabled: true
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: true
  kind: 1D
  hidden_dim: 32
  depth: 3
  num_grid: 256
  max_range_factor: 2.5
  lr: 1.0e-3
  init_train_epochs: 2000

data_loss:
  kind: mse 

data_loss_balancer:
  use_loss_balancer: true
  kind: gated_trainable
  rejection_cost: 1.0

# Model I/O
in_features: 3   # (x,y,t)
out_features: 2  # (u,v)

offset:
  enabled: false