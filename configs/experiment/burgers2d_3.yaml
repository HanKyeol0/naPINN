# simulation run: scripts/simulation/burgers_3.sh
# experiment(back) run: scripts/mlp/burgers2d_3.sh
# experiment(fore) run: scripts/mlp/z_burgers2d_3_fore.sh

# common
domain:
  x: [0.0, 4.0]
  y: [0.0, 4.0]
  burn_in_time: 0.1
  record_time: 3.0

pde:
  learn_nu: true # true / false
  init_nu: 0.0
  nu: 0.01      # Viscosity

# simulation
simulation_tag: "Burgers2D_3-5"
sim_description: fixed_grid measurement, 15*15 points
dir_path: pinnlab/simulation/simulation_result/

collocation_points:
  nx: 100
  ny: 100
  dt: 0.002

simulation_points: # for evaluation
  nx: 120
  ny: 120
  dt: 0.002
  every: 10  # Save simulation state every 10 steps

measurement:
  measure_kind: fixed_grid # random / fixed_random / fixed_grid
  n_measurement: 5000 # only for random
  n_sensors: 100 # only for fixed_random
  sensor_nx: 15 # only for fixed_grid
  sensor_ny: 15 # only for fixed_grid

# experiment

# experiment(back) run: scripts/mlp/burgers2d_3.sh
# experiment(fore) run: scripts/mlp/z_burgers2d_3_fore.sh

tag: b2_L1 # 3-3_a2_va
exp_description: 4G, outlier scale (3-10), base scale 0.1, 5% outliers, fixed_grid measurement
device: cuda
wandb_project: naPINN_Burgers_v4

batch:
  n_f: 5000

noise:
  enabled: true
  batch_size: 1000
  kind: 4G # G, Goff, sG, u, 3G, 4G, 3G0, mix0, Gmix, rmix, sGtest
  par_list: [[-9.0, 2],[-0.3,4],[2.7,0.6],[8.5,1]]
  # par_list: [[-8.0, 2],[0.7,4],[3.7,0.6],[9.5,1]]
  pars: [0.0, 4.0]
  
  scale: 0.1 # not used in the recent version
  # relative_scale: 0.20  # 20% relative error proportional to velocity
  # floor_scale: 0.05     # 5% of global mean as minimum noise floor

  extra_noise:
    enabled: true
    kind: std  # 'std' or 'mean_level'
    n_points: 3360
    scale_min: 3.0
    scale_max: 10.0

# phase
phase:
  enabled: false # true / false
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: true
  kind: 1D # 1D / 2D
  hidden_dim: 32
  depth: 4
  num_grid: 1024
  max_range_factor: 2.5
  lr: 1.0e-3
  use_nll: false
  init_train_epochs: 5000

data_loss:
  kind: L1 # mse, L1, q_gaussian
  # q-Gaussian settings
  q: 2.9
  beta: null

data_loss_balancer:
  use_loss_balancer: false # true / false
  kind: gated_trainable # pw, inverse, mlp, gated, gated_trainable
  rejection_cost: 0.5 # only for gated_trainable
  weight_net:
    hidden_dim: 32
    depth: 3

# Model I/O
in_features: 3   # (x,y,t)
out_features: 2  # (u,v)

offset:
  enabled: false
  init: 0.0

# video
video:
  enabled: true
  every: 10000
  grid:
    nx: 120
    ny: 120
    nt: 120
  fps: 10
  format: mp4