# simulation run: scripts/simulation/fitzhugh_nagumo_rd.sh

domain:
  x: [0.0, 4.0]
  y: [0.0, 4.0]
  burn_in_time: 0.5
  record_time: 4.0

pde:
  Du: 0.3
  Dv: 0.1
  a: 0.7
  b: 0.8
  epsilon: 0.08
  I: 0.5
  learn_Du: false
  learn_Dv: false
  learn_a: false
  learn_b: false
  learn_epsilon: false
  learn_I: false

simulation_tag: "FitzHughNagumoRD2D_1"
description: fixed grid measurement
dir_path: pinnlab/simulation/simulation_result/

collocation_points:
  nx: 100
  ny: 100
  dt: 0.01

simulation_points:
  nx: 120
  ny: 120
  dt: 0.01
  every: 5

measurement:
  measure_kind: fixed_grid
  n_measurement: 5000
  n_sensors: 100
  sensor_nx: 20
  sensor_ny: 20

tag: 1_L1
device: cuda
wandb_project: naPINN_FitzHughNagumoRD

batch:
  n_f: 5000

noise:
  enabled: true
  batch_size: 1000
  kind: 4G
  par_list: [[-8.0, 2],[0.7,4],[3.7,0.6],[9.5,1]]
  pars: [0.0, 4.0]
  scale: 0.1
  extra_noise:
    enabled: true
    kind: std
    n_points: 5000
    scale_min: 3.0
    scale_max: 10.0

phase:
  enabled: false
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: true
  kind: 1D
  hidden_dim: 32
  depth: 4
  num_grid: 1024
  max_range_factor: 2.5
  lr: 1.0e-3
  use_nll: false
  init_train_epochs: 5000

data_loss:
  kind: L1
  q: 2.9
  beta: null

data_loss_balancer:
  use_loss_balancer: false
  kind: gated_trainable
  rejection_cost: 0.5
  weight_net:
    hidden_dim: 32
    depth: 3

in_features: 3
out_features: 2

offset:
  enabled: false
  init: 0.0

video:
  enabled: true
  every: 10000
  grid:
    nx: 100
    ny: 100
    nt: 100
  fps: 10
  format: mp4
