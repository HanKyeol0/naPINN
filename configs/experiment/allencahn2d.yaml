# scripts/mlp/allencahn2d.sh
# scripts/mlp/z_allencahn2d_fore.sh
# scripts/bpinn/allencahn2d.sh
# scripts/bpinn/z_allencahn2d_fore.sh

tag: thres_train_a0 # c5_va_rewind # na / va / L1 / qG2 / qG3
device: "cuda:0"
wandb_project: naPINN_rebuttal
exp_description: "Ablation: learnable threshold without EBM or density estimation"

domain:
  x: [0.0, 2.0]
  y: [0.0, 2.0]
  t: [0.0, 2.0]
in_features: 3
out_features: 1

pde:
  learn_eps: true # true / false
  omega: 8.0
  init_eps: 1.0
  eps: 0.3

# sampling
sampling_mode: grid # random / grid
grid:
  nx: 100
  ny: 100
  nt: 100
batch:
  n_f: 5000

# noise
noise:
  enabled: true
  batch_size: 1000
  kind: 4G # G, 4G, Laplace, StudentT
  scale: 0.1 # default: 0.1
  pars: [0.0, 4.0]
  par_list: [[-9.0, 2],[-0.3,4],[2.7,0.6],[8.5,1]]
  # par_list: [[-8.0, 2],[0.7,4],[3.7,0.6],[9.5,1]] # 4G

  sensor_mode: fixed_grid # random / fixed_random / fixed_grid
  n_train: 5000 # only for random
  n_sensors: 100 # only for fixed_random
  sensor_nx: 15 # only for fixed_grid
  sensor_ny: 15 # only for fixed_grid

  extra_noise:
    enabled: true
    kind: std # 'std' or 'mean_level'
    n_points: 1120 # 1120 / 2250 / 3375
    scale_min: 3.0
    scale_max: 10.0

# phase
phase:
  enabled: true # true / false
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: false
  density_estimator: ebm # "ebm" | "gmm" | "kde"
  std_mode: ema          # "ema" (running EMA std) | "batch" (per-batch std)
  momentum: 0.05         # EMA momentum (only used when std_mode: ema)
  hidden_dim: 32
  depth: 4
  num_grid: 1024
  lr: 1.0e-3
  init_train_epochs: 5000

data_loss:
  kind: mse # mse, L1, q_gaussian
  # q-Gaussian settings
  q: 1.9 # 1.9 / 2.9
  beta: null

data_loss_balancer:
  use_loss_balancer: true # true / false
  kind: threshold # gated_trainable, quantile, threshold
  init_threshold: 1.0        # Initial tau (in units of scaled residual std)
  init_steepness: 10.0       # Initial sigmoid steepness
  rejection_cost: 0.5 # only for gated_trainable
# video
video:
  enabled: true
  every: 10000
  grid:
    nx: 120
    ny: 120
    nt: 120
  fps: 10
  format: mp4
