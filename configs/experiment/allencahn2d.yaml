# scripts/mlp/allencahn2d.sh
# scripts/mlp/z_allencahn2d_fore.sh

tag: test_qG3 # na / va / L1 / qG2 / qG3
device: cuda
wandb_project: naPINN_test

domain:
  x: [0.0, 4.0]
  y: [0.0, 4.0]
  t: [0.0, 4.0]
in_features: 3
out_features: 1

pde:
  learn_eps: true # true / false
  omega: 8.0
  init_eps: 1.0
  eps: 0.3

# sampling
sampling_mode: grid # random / grid
grid:
  nx: 100
  ny: 100
  nt: 100
batch:
  n_f: 5000

# noise
noise:
  enabled: true
  batch_size: 1000
  kind: G # G, Goff, sG, u, 3G, 3G0, mix0, Gmix, rmix, sGtest
  scale: 0.1 # default: 0.1
  pars: [0.0, 4.0]

  sensor_mode: fixed_grid # random / fixed_random / fixed_grid
  n_train: 5000 # only for random
  n_sensors: 100 # only for fixed_random
  sensor_nx: 15 # only for fixed_grid
  sensor_ny: 15 # only for fixed_grid

  extra_noise:
    enabled: true
    kind: std # 'std' or 'mean_level'
    n_points: 2000
    scale_min: 3.0
    scale_max: 10.0

# phase
phase:
  enabled: false # true / false
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: true
  hidden_dim: 32
  depth: 4
  num_grid: 1024
  max_range_factor: 2.5
  lr: 1.0e-3
  use_nll: false
  init_train_epochs: 5000

data_loss:
  kind: L1 # mse, L1, q_gaussian
  # q-Gaussian settings
  q: 2.9 # 1.9 / 2.9
  beta: null

data_loss_balancer:
  use_loss_balancer: false # true / false
  kind: gated_trainable # pw, inverse, mlp, gated, gated_trainable
  weight_net:
    hidden_dim: 32
    depth: 3

offset:
  enabled: false
  init: 0.0

# video
video:
  enabled: true
  every: 10000
  grid:
    nx: 120
    ny: 120
    nt: 120
  fps: 10
  format: mp4