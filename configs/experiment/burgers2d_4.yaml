# simulation run: scripts/simulation/burgers_4.sh
# experiment(back) run: scripts/mlp/burgers2d_4.sh
# experiment(fore) run: scripts/mlp/z_burgers2d_4_fore.sh

# common
domain:
  x: [0.0, 3.0]
  y: [0.0, 3.0]
  burn_in_time: 0.1
  record_time: 2.0

pde:
  learn_nu: true # true / false
  init_nu: 0.0
  nu: 0.01      # Viscosity

# simulation
simulation_tag: "Burgers2D_4-1"
description: fixed_grid measurement, 20*20 points
dir_path: pinnlab/simulation/simulation_result/

collocation_points:
  nx: 100
  ny: 100
  dt: 0.001

simulation_points: # for evaluation
  nx: 120
  ny: 120
  dt: 0.001
  every: 10  # Save simulation state every 10 steps

measurement:
  measure_kind: fixed_grid # random / fixed_random / fixed_grid
  n_measurement: 5000 # only for random
  n_sensors: 100 # only for fixed_random
  sensor_nx: 15 # only for fixed_grid
  sensor_ny: 15 # only for fixed_grid

# experiment

# experiment(back) run: scripts/mlp/burgers2d_4.sh
# experiment(fore) run: scripts/mlp/z_burgers2d_4_fore.sh

tag: 4-1_a2_qG3
description: 3G, outlier scale (10-50), 500 points, fixed_grid measurement
device: cuda

batch:
  n_f: 5000

noise:
  enabled: true
  batch_size: 1000
  kind: 3G # G, Goff, sG, u, 3G, 3G0, mix0, Gmix, rmix, sGtest
  pars: [0.0, 4.0]
  
  scale: 0.1 # not used in the recent version
  # relative_scale: 0.20  # 20% relative error proportional to velocity
  # floor_scale: 0.05     # 5% of global mean as minimum noise floor

  extra_noise:
    enabled: true
    kind: std  # 'std' or 'mean_level'
    n_points: 5000
    scale_min: 30.0
    scale_max: 100.0

# phase
phase:
  enabled: false # true / false
  phase1_epochs: 5000
  phase2_epochs: 25000

ebm:
  enabled: true
  kind: 1D # 1D / 2D
  hidden_dim: 32
  depth: 4
  num_grid: 1024
  max_range_factor: 2.5
  lr: 1.0e-3
  use_nll: false
  init_train_epochs: 5000

data_loss:
  kind: q_gaussian # mse, L1, q_gaussian
  # q-Gaussian settings
  q: 2.9
  beta: null

data_loss_balancer:
  use_loss_balancer: false # true / false
  kind: gated_trainable # pw, inverse, mlp, gated, gated_trainable
  rejection_cost: 0.5 # only for gated_trainable
  weight_net:
    hidden_dim: 32
    depth: 3

# Model I/O
in_features: 3   # (x,y,t)
out_features: 2  # (u,v)

offset:
  enabled: false
  init: 0.0

# video
video:
  enabled: true
  every: 10000
  grid:
    nx: 100
    ny: 100
    nt: 100
  fps: 10
  format: mp4